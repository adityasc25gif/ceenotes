<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocVault – Secure File Share</title>
  <meta name="description" content="Admin uploads to Supabase. Public downloads. Permanent storage." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="page-bg"></div>

  <button class="theme-toggle" id="themeToggle" title="Toggle light/dark" aria-label="Toggle theme">
    <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
    <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>

  <header class="header">
    <div class="logo">
      <div class="logo-mark">D</div>
      <div>
        <div class="logo-text">DocVault</div>
        <div class="logo-sub">Supabase storage · Permanent · Max 50 MB / file</div>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="admin-bar card">
      <span id="adminStatus" class="admin-status">Public view — download only</span>
      <div class="admin-actions">
        <button class="btn btn-ghost" id="adminLoginBtn">Admin Login</button>
        <button class="btn btn-ghost" id="adminLogoutBtn" hidden>Logout</button>
      </div>
    </div>

    <div class="login-box card" id="loginBox" hidden>
      <input type="password" id="adminPasswordInput" class="input" placeholder="Admin password" />
      <button class="btn btn-primary" id="adminLoginSubmit">Login</button>
      <p class="login-error" id="loginError" hidden>Wrong password</p>
    </div>

    <div id="adminOnlyArea" hidden>
      <div class="options-bar card">
        <label class="chip"><input type="checkbox" id="usePassword" /> Password note</label>
        <label class="chip"><input type="checkbox" id="zipMultiple" checked /> ZIP multiple</label>
        <label class="chip"><input type="checkbox" id="folderMode" /> Folder</label>
        <label class="chip select-chip" hidden>
          Expiry
          <select id="expirySelect"><option value="never">Never</option></select>
        </label>
      </div>

      <div class="password-row" id="passwordRow" hidden>
        <input type="password" id="filePassword" class="input" placeholder="Optional note password (min 4 chars)" />
      </div>

      <section class="upload-card card" id="dropZone">
        <div class="upload-icon">⬆</div>
        <h2>Drop files here</h2>
        <p class="muted">Supabase only · Max 50 MB per file · Permanent storage</p>
        <input type="file" id="fileInput" multiple hidden />
        <input type="file" id="folderInput" webkitdirectory directory multiple hidden />
        <button class="btn btn-primary" id="browseBtn" type="button">Choose files</button>
      </section>

      <section class="files-section card" id="filesSection" hidden>
        <div class="section-header">
          <h3>Just uploaded</h3>
          <button class="btn-text" id="clearBtn">Clear</button>
        </div>
        <div class="files-list" id="filesList"></div>
      </section>
    </div>

    <section class="files-section card" id="historySection">
      <div class="section-header">
        <h3>Available files</h3>
        <div class="section-tools">
          <input type="search" id="searchInput" class="input search-input" placeholder="Search files…" />
          <button class="btn btn-ghost" id="copyAllBtn" title="Copy all links">Copy all</button>
          <button class="btn-text" id="refreshHistoryBtn">Refresh</button>
        </div>
      </div>
      <div id="historyEmpty" class="history-empty">No files yet.</div>
      <div class="files-list" id="historyList"></div>
    </section>
  </main>

  <div class="modal" id="previewModal" hidden>
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-content card">
      <button class="modal-close" id="modalClose">&times;</button>
      <div id="previewBody"></div>
    </div>
  </div>

  <footer class="footer muted">Powered by Supabase · Files stay permanent</footer>
  <script src="app.js"></script>
</body>
</html>
